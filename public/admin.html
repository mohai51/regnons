<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REGNONS - Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-container { padding: 40px 0; }
    .box { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 25px; margin-bottom: 25px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 4px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; }
    .hidden { display: none; }
    .item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
    .btn-del { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="container admin-container">
    
    <!-- Auth Section -->
    <div id="auth-section" class="box">
      <h2>Admin Login</h2>
      <div class="form-group" style="margin-top: 15px;">
        <input type="password" id="admin-passkey" placeholder="Enter Admin Passkey">
      </div>
      <button onclick="loginAdmin()" class="btn-primary">Unlock</button>
    </div>

    <!-- Dashboard -->
    <div id="dashboard-section" class="hidden">
      
      <!-- Service Manager -->
      <div class="box">
        <h3>Add Service</h3>
        <form id="add-service-form" style="margin-top: 15px;">
          <div class="form-group">
            <label>Title</label>
            <input type="text" id="service-title" required>
          </div>
          <div class="form-group">
            <label>Category</label>
            <select id="service-category">
              <option value="Software Development">Software Development</option>
              <option value="Academic Projects">Academic Projects</option>
              <option value="Digital Marketing">Digital Marketing</option>
            </select>
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea id="service-desc" rows="2" required></textarea>
          </div>
          <div class="form-group">
            <label>Image URL (Optional)</label>
            <input type="url" id="service-img" placeholder="https://example.com/image.jpg">
          </div>
          <div class="form-group">
  <label>Explore / External Link (Optional)</label>
  <input type="url" id="service-link" placeholder="https://example.com/service-details">
</div>
          <button type="submit" class="btn-primary">Add Service</button>
        </form>
        <div id="admin-services-list" style="margin-top: 15px;"></div>
      </div>

      <!-- Project Manager -->
      <div class="box">
        <h3>Add Portfolio / Project</h3>
        <form id="add-project-form" style="margin-top: 15px;">
          <div class="form-group">
            <label>Project Title</label>
            <input type="text" id="project-title" required>
          </div>
          <div class="form-group">
            <label>Tech Stack</label>
            <input type="text" id="project-tech" placeholder="e.g. React, Node.js" required>
          </div>
          <div class="form-group">
            <label>Category</label>
            <select id="project-category">
              <option value="Client Project">Client Project</option>
              <option value="Academic / University">Academic / University</option>
            </select>
          </div>
          <div class="form-group">
            <label>Project Cover Image URL</label>
            <input type="url" id="project-img" placeholder="https://example.com/cover.jpg">
          </div>
          <div class="form-group">
  <label>Project Live / GitHub Link (Optional)</label>
  <input type="url" id="project-link" placeholder="https://github.com/your-repo or demo link">
</div>
          <button type="submit" class="btn-primary">Add Project</button>
        </form>
        <div id="admin-projects-list" style="margin-top: 15px;"></div>
      </div>

      <!-- Messages -->
      <div class="box">
        <h3>Contact Messages</h3>
        <div id="admin-inquiries-list" style="margin-top: 15px;"></div>
      </div>

    </div>

  </div>
  

  <script src="app.js"></script>
</body>
</html>
