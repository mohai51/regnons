<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REGNONS - Empowering Ideas, Leading the Future</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  
  <!-- Navigation -->
<nav class="navbar">
  <div class="container nav-container">
    <a href="#" class="logo-wrapper" style="display: flex; align-items: center; gap: 10px; text-decoration: none;">
      <!-- PNG Logo Addition -->
      <img src="Regnons1.png" alt="REGNONS Logo" style="height: 40px; width: auto; object-fit: contain;border-radius: 10px; box-shadow: 0 5px 6px rgba(2, 0, 0, 0.1);">
      <span class="logo-text" style="font-size: 1.4rem; font-weight: 800; color: #0f2b48; letter-spacing: 2px;">REGN<span style="color: #d97706;">O</span>NS</span>
    </a>

    <ul class="nav-links">
      <li><a href="#services" class="nav-btn">Services</a></li>
      <li><a href="#projects" class="nav-btn">Projects</a></li>
      <!-- Facebook Inbox Link (m.me Link) -->
      <li><a href="https://www.facebook.com/profile.php?id=61594499150741" target="_blank" class="btn-primary" style="color: #f7f8fa; background: #0f2b48;">Contact Us</a></li>
    </ul>
  </div>
</nav>

  <!-- Hero Section -->
  <header class="hero">
    <div class="container hero-content">
      <span class="badge">Tech Agency & Academic Solutions</span>
      <h1>Empowering Ideas, <br><span class="highlight">Leading the Future.</span></h1>
      <p>Custom Software Development, University Projects, and Strategic Marketing.</p>
      <div class="hero-btns">
        <a href="#contact" class="btn-primary">Start a Project</a>
        <a href="#services" class="btn-secondary">Explore Services</a>
      </div>
    </div>
  </header>

  <!-- Services -->
  <section id="services" class="services-section">
    <div class="container">
      <div class="section-title">
        <h2>Our Services</h2>
      </div>
      <div id="services-grid" class="grid"></div>
    </div>
  </section>

  <!-- Projects -->
  <section id="projects" class="projects-section">
    <div class="container">
      <div class="section-title">
        <h2>Portfolio & University Projects</h2>
      </div>
      <div id="projects-grid" class="grid"></div>
    </div>
  </section>

  <!-- Contact -->
<section id="contact" class="contact-section">
  <div class="container">
    <div class="contact-card">
      <div>
        <h2>Let's Talk</h2>
        
        <form id="contact-form" class="contact-form">
          <input type="text" id="name" placeholder="Your Name" required>
          <input type="email" id="email" placeholder="Your Email" required>
          <select id="projectType" required>
            <option value="Web Development">Web Development</option>
            <option value="Academic Project Support">Academic Project Support</option>
            <option value="Digital Marketing">Digital Marketing</option>
          </select>
          <textarea id="message" rows="4" placeholder="Your Message" required></textarea>
          <button type="submit" class="btn-primary">Send Message</button>
          <p id="form-response"></p>
        </form>
      </div>
    </div>
  </div>
</section>

  <script src="app.js"></script>
</body>
</html>
